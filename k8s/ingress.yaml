apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medsync-ingress
  namespace: medsync
  # No rewrite-target: each path below is the same prefix the service
  # mounts internally, so the request path is forwarded unchanged.
spec:
  # Consultations, records and payments cross this boundary, so the edge must
  # terminate TLS. Create the medsync-tls secret with a certificate for this
  # host (cert-manager, or `kubectl create secret tls`) before applying
  # (V-D12).
  tls:
    - hosts:
        - medsync.local
      secretName: medsync-tls
  rules:
  - host: medsync.local
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: 5000
      - path: /api/patients
        pathType: Prefix
        backend:
          service:
            name: patient-management
            port:
              number: 3001
      - path: /api/doctors
        pathType: Prefix
        backend:
          service:
            name: doctor-management
            port:
              number: 3002
      - path: /api/appointments
        pathType: Prefix
        backend:
          service:
            name: appointment
            port:
              number: 3003
      - path: /api/sessions
        pathType: Prefix
        backend:
          service:
            name: telemedicine
            port:
              number: 3004
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: payment
            port:
              number: 3005
      - path: /api/notify
        pathType: Prefix
        backend:
          service:
            name: notification
            port:
              number: 3006
      - path: /api/symptom-checker
        pathType: Prefix
        backend:
          service:
            name: ai-symptom-checker
            port:
              number: 3007
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
