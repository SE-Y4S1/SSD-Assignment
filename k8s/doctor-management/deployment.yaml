apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-management
  namespace: medsync
  labels:
    app: doctor-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doctor-management
  template:
    metadata:
      labels:
        app: doctor-management
    spec:
      # No workload needs the Kubernetes API, so do not mount a token for it.
      automountServiceAccountToken: false
      # The images run as the unprivileged node user; hold the cluster to it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: doctor-management
        image: doctor-management:v1.0.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3002
        env:
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: medsync-secrets
              key: MONGO_ROOT_USERNAME
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: medsync-secrets
              key: MONGO_ROOT_PASSWORD
        - name: MONGO_URI
          value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/doctor_db?authSource=admin"
        - name: PORT
          value: "3002"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-management
  namespace: medsync
spec:
  selector:
    app: doctor-management
  ports:
  - protocol: TCP
    port: 3002
    targetPort: 3002
  type: ClusterIP
