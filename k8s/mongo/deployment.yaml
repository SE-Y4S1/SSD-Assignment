apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: medsync
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      # No workload needs the Kubernetes API, so do not mount a token for it.
      automountServiceAccountToken: false
      containers:
      - name: mongo
        image: mongo:6.0
        # Creates the administrative user on first start, so the database no
        # longer accepts unauthenticated connections (V-D12).
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: medsync-secrets
              key: MONGO_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: medsync-secrets
              key: MONGO_ROOT_PASSWORD
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-data
