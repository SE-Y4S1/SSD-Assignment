apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: medsync
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      # No workload needs the Kubernetes API, so do not mount a token for it.
      automountServiceAccountToken: false
      # The images run as the unprivileged node user; hold the cluster to it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: notification
        image: notification:v1.0.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3006
        env:
        - name: PORT
          value: "3006"
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: medsync
  labels:
    app: notification
spec:
  selector:
    app: notification
  ports:
  - port: 3006
    targetPort: 3006
    name: http
  type: ClusterIP