apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-checker
  namespace: medsync
  labels:
    app: ai-symptom-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-checker
  template:
    metadata:
      labels:
        app: ai-symptom-checker
    spec:
      # No workload needs the Kubernetes API, so do not mount a token for it.
      automountServiceAccountToken: false
      # The images run as the unprivileged node user; hold the cluster to it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ai-symptom-checker
        image: ai-symptom-checker:v1.0.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3007
        env:
        - name: KAFKA_BROKERS
          value: "kafka:9092"
        - name: PORT
          value: "3007"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-checker
  namespace: medsync
spec:
  selector:
    app: ai-symptom-checker
  ports:
  - protocol: TCP
    port: 3007
    targetPort: 3007
  type: ClusterIP
