apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medsync

resources:
  - namespace.yaml
  - secrets.yaml
  - network-policies.yaml
  - mongo/pvc.yaml
  - mongo/deployment.yaml
  - mongo/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - zookeeper/deployment.yaml
  - kafka/deployment.yaml
  - auth/deployment.yaml
  - notification/deployment.yaml
  - patient-management/deployment.yaml
  - doctor-management/deployment.yaml
  - appointment/deployment.yaml
  - telemedicine/deployment.yaml
  - payment/deployment.yaml
  - ai-symptom-checker/deployment.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml

# Images are pinned to a fixed version tag rather than latest, which any
# build can move. Build with the same tag, for example
# `docker build -t auth:v1.0.0 backend/services/auth`, and bump it per
# release. With a registry, replace newTag with newName plus a digest
# (image@sha256:...) so the deployed bytes cannot change at all (V-D21).
images:
  - name: auth
    newTag: v1.0.0
  - name: notification
    newTag: v1.0.0
  - name: patient-management
    newTag: v1.0.0
  - name: doctor-management
    newTag: v1.0.0
  - name: appointment
    newTag: v1.0.0
  - name: telemedicine
    newTag: v1.0.0
  - name: payment
    newTag: v1.0.0
  - name: ai-symptom-checker
    newTag: v1.0.0
  - name: frontend
    newTag: v1.0.0
