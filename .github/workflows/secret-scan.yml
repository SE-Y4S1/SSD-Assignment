# Fails the run when a secret is committed. See docs/SECRET-ROTATION.md (V-A02).
#
# This runs the gitleaks binary directly rather than gitleaks/gitleaks-action.
# That action requires a GITLEAKS_LICENSE for repositories owned by a GitHub
# organization, which this one is, so it exits before it scans anything. The
# CLI has no such requirement, and pinning the version keeps the result
# reproducible.
name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not just the tip: a secret committed earlier and
          # deleted later is still in the history and still disclosed.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan the full history for committed secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Keep the report when something is found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
